# Сгенерировано proxy-rs (proxy-clash)
# прокси: 335 | групп: 44 | стран: 33
mode: rule
ipv6: false
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  default-nameserver:
  - 223.5.5.5
  - 8.8.8.8
  nameserver:
  - https://cloudflare-dns.com/dns-query
  - https://dns.google/dns-query
  - tls://8.8.8.8
  nameserver-policy:
    geosite:category-ru: https://dns.alidns.com/dns-query
    geosite:RU-BLOCKED: https://cloudflare-dns.com/dns-query
keep-alive-idle: 600
keep-alive-interval: 30
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - '80'
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - '443'
      - '8443'
    QUIC:
      ports:
      - '443'
      - '8443'
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
